name: GoTest

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:

    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: "go.mod"

    - name: Get dependencies
      run: |
        go mod download

    # `make lint` runs `go vet`, which compiles all provider packages internally
    # without spending time linking and installing an unused binary via `go install`.
    - name: Build and Lint
      run: make lint

    - name: Test
      run: |
        make docscheck
        make testnolint
